<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>SiMAF</title>
<link rel="stylesheet" href="../../colors_and_type.css" />
<style>
  html, body { margin:0; padding:0; background: var(--bg); color: var(--fg); }
  body { font-family: var(--font-sans); position:relative; min-height:100vh; }
  body {
    --simaf-bg-image: url("img/logo-final.png");
  }
  body[data-bg-variant="a"] {
    --simaf-bg-image: url("img/logo_final_a.png");
  }
  body[data-bg-variant="b"] {
    --simaf-bg-image: url("img/logo_final_b.png");
  }
  body[data-bg-variant="c"] {
    --simaf-bg-image: url("img/logo_final_c.png");
  }
  body::before {
    content:"";
    position:fixed;
    inset:-35vmax;
    background:var(--simaf-bg-image) center / cover no-repeat;
    opacity:0.12;
    pointer-events:none;
    z-index:0;
    animation: simaf-bg-rotate 180s linear infinite;
    transform-origin:center;
  }
  @keyframes simaf-bg-rotate {
    from { transform:rotate(0deg); }
    to { transform:rotate(360deg); }
  }
  #root { position:relative; z-index:1; }
  * { box-sizing: border-box; }
  a { color: var(--accent); }
  [data-screen-label] { scroll-margin-top: 80px; }
  .bg-variant-picker {
    position:fixed;
    right:18px;
    bottom:18px;
    z-index:20;
    display:flex;
    gap:4px;
    padding:5px;
    border:1px solid var(--border);
    border-radius:4px;
    background:color-mix(in srgb, var(--bg) 92%, white);
    box-shadow:0 12px 24px rgba(12,15,26,0.14);
  }
  .bg-variant-picker button {
    width:36px;
    height:32px;
    border:1px solid transparent;
    border-radius:3px;
    background:transparent;
    color:var(--fg-muted);
    font:600 12px/1 var(--font-sans);
    cursor:pointer;
  }
  .bg-variant-picker button:hover {
    background:var(--bg-sunken);
    color:var(--fg);
  }
  .bg-variant-picker button[aria-pressed="true"] {
    border-color:var(--accent);
    background:color-mix(in srgb, var(--accent) 12%, transparent);
    color:var(--accent);
  }
  @media (max-width: 720px) {
    .bg-variant-picker { right:12px; bottom:12px; }
  }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="Header.jsx"></script>
<script type="text/babel" src="Hero.jsx"></script>
<script type="text/babel" src="ResearchLines.jsx"></script>
<script type="text/babel" src="Publications.jsx"></script>
<script type="text/babel" src="People.jsx?v=20260423-network"></script>
<script type="text/babel" src="Network.jsx"></script>
<script type="text/babel" src="Collaborations.jsx"></script>
<script type="text/babel" src="Footer.jsx"></script>
<script src="../../pappers/manifest.js"></script>
<script type="text/babel" src="FeaturedArticle.jsx"></script>
<script type="text/babel">
const { useEffect, useState } = React;

const bgVariants = [
  { id: 'a', label: 'A' },
  { id: 'b', label: 'B' },
  { id: 'c', label: 'C' }
];

function App() {
  const saved = (typeof localStorage !== 'undefined' && localStorage.getItem('simaf_screen')) || 'home';
  const savedLang = (typeof localStorage !== 'undefined' && localStorage.getItem('simaf_lang')) || 'es';
  const storedBg = (typeof localStorage !== 'undefined' && localStorage.getItem('simaf_bg_variant')) || 'a';
  const savedBg = bgVariants.some(variant => variant.id === storedBg) ? storedBg : 'a';
  const [screen, _setScreen] = useState(saved);
  const [lang, _setLang] = useState(savedLang);
  const [bgVariant, _setBgVariant] = useState(savedBg);
  const setScreen = s => { _setScreen(s); try { localStorage.setItem('simaf_screen', s);} catch(e){} window.scrollTo({top:0, behavior:'instant'}); };
  const setLang = l => { _setLang(l); try { localStorage.setItem('simaf_lang', l);} catch(e){} };
  const setBgVariant = variant => {
    _setBgVariant(variant);
    try { localStorage.setItem('simaf_bg_variant', variant); } catch(e){}
  };

  useEffect(() => {
    if (bgVariant === 'original') {
      document.body.removeAttribute('data-bg-variant');
    } else {
      document.body.setAttribute('data-bg-variant', bgVariant);
    }
  }, [bgVariant]);

  return (
    <>
      <Header screen={screen} setScreen={setScreen} lang={lang} setLang={setLang} />
      <div className="bg-variant-picker" aria-label={lang==='es'?'Variantes de fondo':'Background variants'}>
        {bgVariants.map(variant => (
          <button
            key={variant.id}
            type="button"
            aria-pressed={bgVariant === variant.id}
            title={lang==='es' ? `Fondo ${variant.label}` : `Background ${variant.label}`}
            onClick={() => setBgVariant(variant.id)}
          >
            {variant.label}
          </button>
        ))}
      </div>
      {screen==='home' && (
        <main data-screen-label="01 Home">
          <FeaturedArticle lang={lang} />
          <Hero lang={lang} />
          <ResearchLines lang={lang} />
          <Publications lang={lang} limit={3} />
          <Footer lang={lang} />
        </main>
      )}
      {screen==='research' && (
        <main data-screen-label="02 Research">
          <div style={{padding:'64px 48px 0', maxWidth:1280, margin:'0 auto'}}>
            <div style={{fontFamily:'var(--font-sans)',fontSize:11,letterSpacing:'0.14em',textTransform:'uppercase',color:'var(--fg-muted)'}}>{lang==='es'?'Investigación':'Research'}</div>
            <h1 style={{fontFamily:'var(--font-serif)',fontSize:56,fontWeight:500,letterSpacing:'-0.02em',lineHeight:1.1,margin:'12px 0 0',maxWidth:'18ch'}}>{lang==='es'?'Siete líneas activas. Un solo objeto: la materia simulada.':'Seven active lines. One object: simulated matter.'}</h1>
          </div>
          <ResearchLines lang={lang} />
          <Footer lang={lang} />
        </main>
      )}
      {screen==='publications' && (
        <main data-screen-label="03 Publications">
          <div style={{padding:'64px 48px 0', maxWidth:1280, margin:'0 auto'}}>
            <div style={{fontFamily:'var(--font-sans)',fontSize:11,letterSpacing:'0.14em',textTransform:'uppercase',color:'var(--fg-muted)'}}>{lang==='es'?'Publicaciones':'Publications'}</div>
            <h1 style={{fontFamily:'var(--font-serif)',fontSize:56,fontWeight:500,letterSpacing:'-0.02em',lineHeight:1.1,margin:'12px 0 0'}}>{lang==='es'?'Artículos arbitrados, 2024–2026.':'Peer-reviewed articles, 2024–2026.'}</h1>
          </div>
          <Publications lang={lang} />
          <Footer lang={lang} />
        </main>
      )}
      {screen==='people' && (
        <main data-screen-label="04 People">
          <div style={{padding:'64px 48px 0', maxWidth:1280, margin:'0 auto'}}>
            <div style={{fontFamily:'var(--font-sans)',fontSize:11,letterSpacing:'0.14em',textTransform:'uppercase',color:'var(--fg-muted)'}}>{lang==='es'?'Personas':'People'}</div>
            <h1 style={{fontFamily:'var(--font-serif)',fontSize:56,fontWeight:500,letterSpacing:'-0.02em',lineHeight:1.1,margin:'12px 0 0'}}>{lang==='es'?'Ocho miembros. Un laboratorio.':'Eight members. One laboratory.'}</h1>
          </div>
          <People lang={lang} setScreen={setScreen} />
          <Footer lang={lang} />
        </main>
      )}
      {screen==='network' && (
        <>
          <Network lang={lang} />
          <Footer lang={lang} />
        </>
      )}
      {screen==='collaborations' && (
        <>
          <Collaborations lang={lang} />
          <Footer lang={lang} />
        </>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
