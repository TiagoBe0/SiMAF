<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>SiMAF</title>
<link rel="stylesheet" href="../../colors_and_type.css" />
<style>
  html, body { margin:0; padding:0; background: var(--bg); color: var(--fg); }
  body { font-family: var(--font-sans); position:relative; min-height:100vh; }
  body {
    --simaf-bg-image: url("img/logo_final_a.png");
  }
  body::before {
    content:"";
    position:fixed;
    inset:-35vmax;
    background:var(--simaf-bg-image) center / cover no-repeat;
    opacity:0.12;
    pointer-events:none;
    z-index:0;
    animation: simaf-bg-rotate 180s linear infinite;
    transform-origin:center;
  }
  @keyframes simaf-bg-rotate {
    from { transform:rotate(0deg); }
    to { transform:rotate(360deg); }
  }
  #root { position:relative; z-index:1; }
  * { box-sizing: border-box; }
  a { color: var(--accent); }
  [data-screen-label] { scroll-margin-top: 80px; }
  .screen-intro {
    padding:64px 48px 0;
    max-width:1280px;
    margin:0 auto;
  }
  .screen-eyebrow {
    font-family:var(--font-sans);
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--fg-muted);
  }
  .screen-title {
    font-family:var(--font-serif);
    font-size:clamp(40px, 6vw, 56px);
    font-weight:500;
    letter-spacing:-0.02em;
    line-height:1.1;
    margin:12px 0 0;
  }
  @media (max-width: 720px) {
    body::before { opacity:0.08; }
    .screen-intro { padding:40px 22px 0; }
  }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="Header.jsx"></script>
<script type="text/babel" src="Hero.jsx"></script>
<script type="text/babel" src="ResearchLines.jsx"></script>
<script type="text/babel" src="Publications.jsx?v=20260423-miniatures"></script>
<script type="text/babel" src="People.jsx?v=20260423-network"></script>
<script type="text/babel" src="Network.jsx"></script>
<script type="text/babel" src="Collaborations.jsx"></script>
<script type="text/babel" src="Footer.jsx"></script>
<script src="../../pappers/manifest.js"></script>
<script type="text/babel" src="FeaturedArticle.jsx?v=20260423-miniatures"></script>
<script type="text/babel">
const { useState } = React;

function App() {
  const saved = (typeof localStorage !== 'undefined' && localStorage.getItem('simaf_screen')) || 'home';
  const savedLang = (typeof localStorage !== 'undefined' && localStorage.getItem('simaf_lang')) || 'es';
  const [screen, _setScreen] = useState(saved);
  const [lang, _setLang] = useState(savedLang);
  const setScreen = s => { _setScreen(s); try { localStorage.setItem('simaf_screen', s);} catch(e){} window.scrollTo({top:0, behavior:'instant'}); };
  const setLang = l => { _setLang(l); try { localStorage.setItem('simaf_lang', l);} catch(e){} };

  return (
    <>
      <Header screen={screen} setScreen={setScreen} lang={lang} setLang={setLang} />
      {screen==='home' && (
        <main data-screen-label="01 Home">
          <FeaturedArticle lang={lang} />
          <Hero lang={lang} />
          <ResearchLines lang={lang} />
          <Publications lang={lang} limit={3} />
          <Footer lang={lang} />
        </main>
      )}
      {screen==='research' && (
        <main data-screen-label="02 Research">
          <div className="screen-intro">
            <div className="screen-eyebrow">{lang==='es'?'Investigación':'Research'}</div>
            <h1 className="screen-title" style={{maxWidth:'18ch'}}>{lang==='es'?'Siete líneas activas. Un solo objeto: la materia simulada.':'Seven active lines. One object: simulated matter.'}</h1>
          </div>
          <ResearchLines lang={lang} />
          <Footer lang={lang} />
        </main>
      )}
      {screen==='publications' && (
        <main data-screen-label="03 Publications">
          <div className="screen-intro">
            <div className="screen-eyebrow">{lang==='es'?'Publicaciones':'Publications'}</div>
            <h1 className="screen-title">{lang==='es'?'Artículos arbitrados, 2024–2026.':'Peer-reviewed articles, 2024–2026.'}</h1>
          </div>
          <Publications lang={lang} />
          <Footer lang={lang} />
        </main>
      )}
      {screen==='people' && (
        <main data-screen-label="04 People">
          <div className="screen-intro">
            <div className="screen-eyebrow">{lang==='es'?'Personas':'People'}</div>
            <h1 className="screen-title">{lang==='es'?'Nueve miembros. Un laboratorio.':'Nine members. One laboratory.'}</h1>
          </div>
          <People lang={lang} setScreen={setScreen} />
          <Footer lang={lang} />
        </main>
      )}
      {screen==='network' && (
        <>
          <Network lang={lang} />
          <Footer lang={lang} />
        </>
      )}
      {screen==='collaborations' && (
        <>
          <Collaborations lang={lang} />
          <Footer lang={lang} />
        </>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
