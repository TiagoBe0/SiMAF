<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);}
  .card{padding:22px 28px;min-height:150px;box-sizing:border-box;font-family:var(--font-sans);}
  .h{font-family:var(--font-serif);font-size:32px;font-weight:500;line-height:1.1;letter-spacing:-0.015em;margin:6px 0 0;color:var(--fg);}
  .eye{font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--fg-muted);}
  .top{border-top:3px double var(--rule);border-bottom:1px solid var(--rule);padding:6px 0;display:flex;justify-content:space-between;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--fg-muted);}
  .sub{font-family:var(--font-serif);font-style:italic;color:var(--fg-muted);font-size:15px;margin-top:8px;max-width:60ch;}
</style></head><body><div class="card">
  <div class="top"><span>SiMAF · VOL. XII · № 04</span><span>ABRIL 2026</span></div>
  <div class="eye" style="margin-top:16px">Línea de investigación 03</div>
  <h1 class="h">Dinámica molecular de aleaciones metálicas amorfas</h1>
  <div class="sub">Se examina la relación entre topología local y transporte electrónico en sistemas <em>Cu–Zr</em> bajo recocido isotérmico.</div>
</div></body></html>
