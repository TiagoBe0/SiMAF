<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);}
  .card{padding:22px 28px;min-height:150px;box-sizing:border-box;font-family:var(--font-sans);display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start;}
  label{font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--fg-muted);display:block;margin-bottom:6px;}
  input,textarea,select{font-family:var(--font-sans);font-size:14px;padding:10px 12px;border:1px solid #c5cad8;border-radius:2px;background:#fff;color:#0c0f1a;width:100%;box-sizing:border-box;outline:none;}
  input:focus{border-color:#0050f0;box-shadow:0 0 0 2px rgba(0,80,240,0.2);}
  .hint{font-size:11px;color:var(--fg-muted);margin-top:4px;font-family:var(--font-serif);font-style:italic;}
  .chip{display:inline-flex;align-items:center;padding:4px 10px;font-size:11px;font-family:var(--font-sans);font-weight:500;letter-spacing:0.06em;border-radius:999px;}
  .chip.ok{background:#e3f5e8;color:#0a7a3e;}
  .chip.warn{background:#faefd4;color:#9a6a00;}
  .chip.info{background:#e3ecff;color:#0050f0;}
</style></head><body><div class="card">
  <div>
    <label>Autor</label>
    <input value="García-Ruiz et al." />
    <div class="hint">Apellido, nombre — estilo periodístico.</div>
  </div>
  <div>
    <label>Año</label>
    <input value="2026" style="border-color:#0050f0;box-shadow:0 0 0 2px rgba(0,80,240,0.2)" />
    <div style="margin-top:10px">
      <span class="chip ok">PUBLICADO</span>
      <span class="chip warn">EN REVISIÓN</span>
      <span class="chip info">PREPRINT</span>
    </div>
  </div>
</div></body></html>
