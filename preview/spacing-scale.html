<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);}
  .card{padding:22px 28px;min-height:150px;box-sizing:border-box;font-family:var(--font-sans);}
  .row{display:flex;align-items:flex-end;gap:14px;}
  .box{background:#0050f0;}
  .cell{display:flex;flex-direction:column;align-items:center;gap:6px;}
  .lbl{font-size:10px;color:var(--fg-muted);letter-spacing:0.08em;}
  .px{font-family:var(--font-mono);font-size:10px;color:var(--fg);}
</style></head><body><div class="card">
<div class="row">
  <div class="cell"><div class="box" style="width:4px;height:4px"></div><div class="lbl">s-1</div><div class="px">4</div></div>
  <div class="cell"><div class="box" style="width:8px;height:8px"></div><div class="lbl">s-2</div><div class="px">8</div></div>
  <div class="cell"><div class="box" style="width:12px;height:12px"></div><div class="lbl">s-3</div><div class="px">12</div></div>
  <div class="cell"><div class="box" style="width:16px;height:16px"></div><div class="lbl">s-4</div><div class="px">16</div></div>
  <div class="cell"><div class="box" style="width:24px;height:24px"></div><div class="lbl">s-5</div><div class="px">24</div></div>
  <div class="cell"><div class="box" style="width:32px;height:32px"></div><div class="lbl">s-6</div><div class="px">32</div></div>
  <div class="cell"><div class="box" style="width:48px;height:48px"></div><div class="lbl">s-7</div><div class="px">48</div></div>
  <div class="cell"><div class="box" style="width:64px;height:64px"></div><div class="lbl">s-8</div><div class="px">64</div></div>
  <div class="cell"><div class="box" style="width:96px;height:96px"></div><div class="lbl">s-9</div><div class="px">96</div></div>
</div>
</div></body></html>
