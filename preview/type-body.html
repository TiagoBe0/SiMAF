<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);}
  .card{padding:22px 28px;min-height:150px;box-sizing:border-box;display:grid;grid-template-columns:1fr 1fr;gap:28px;}
  .tag{font-family:var(--font-sans);font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--fg-muted);margin-bottom:6px;}
  .lead{font-family:var(--font-serif);font-size:21px;font-style:italic;line-height:1.5;color:var(--fg-muted);}
  .body{font-family:var(--font-serif);font-size:18px;line-height:1.65;color:var(--fg);max-width:44ch;}
</style></head><body><div class="card">
<div>
  <div class="tag">Lead · Garamond italic 21/1.5</div>
  <p class="lead">Se estudian propiedades estructurales y dinámicas de aleaciones metálicas amorfas.</p>
</div>
<div>
  <div class="tag">Body · Garamond 18/1.65</div>
  <p class="body">El grupo desarrolla métodos computacionales para el estudio de fenómenos físicos mediante simulaciones de dinámica molecular y cálculos <em>ab initio</em>.</p>
</div>
</div></body></html>
