<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);}
  .card{padding:22px 28px;min-height:150px;box-sizing:border-box;font-family:var(--font-sans);display:grid;grid-template-columns:1fr 1fr;gap:24px;}
  .pub{border-top:3px double var(--rule);border-bottom:1px solid var(--border);padding:12px 0;}
  .year{font-family:var(--font-sans);font-size:11px;letter-spacing:0.14em;color:var(--fg-muted);}
  .title{font-family:var(--font-serif);font-size:18px;font-weight:500;line-height:1.35;margin:4px 0 6px;color:var(--fg);}
  .auth{font-family:var(--font-serif);font-style:italic;font-size:14px;color:var(--fg-muted);}
  .meta{font-family:var(--font-mono);font-size:11px;color:var(--fg-muted);margin-top:6px;}
  .person{display:flex;gap:14px;align-items:center;border:1px solid var(--border);padding:14px;border-radius:2px;background:#fff;}
  .avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#00173c,#0050f0);color:#fbf9f4;display:flex;align-items:center;justify-content:center;font-family:var(--font-serif);font-size:20px;}
  .pname{font-family:var(--font-serif);font-size:16px;font-weight:500;color:var(--fg);}
  .prole{font-family:var(--font-sans);font-size:11px;color:var(--fg-muted);letter-spacing:0.08em;text-transform:uppercase;margin-top:2px;}
</style></head><body><div class="card">
<div class="pub">
  <div class="year">2026</div>
  <div class="title">Structural relaxation in amorphous Cu₆₄Zr₃₆ under isothermal annealing</div>
  <div class="auth">García-Ruiz, M.; Hernández, L.; Patel, S.</div>
  <div class="meta">J. Chem. Phys. 164, 024501 · arXiv:2601.04821</div>
</div>
<div class="person">
  <div class="avatar">MG</div>
  <div>
    <div class="pname">M. García-Ruiz</div>
    <div class="prole">Investigador principal</div>
  </div>
</div>
</div></body></html>
