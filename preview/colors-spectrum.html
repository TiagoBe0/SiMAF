<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);}
  .card{padding:24px 28px;min-height:150px;box-sizing:border-box;font-family:var(--font-sans);}
  .row{display:flex;gap:8px;flex-wrap:wrap;}
  .sw{display:flex;flex-direction:column;gap:6px;width:76px;}
  .chip{width:76px;height:76px;border-radius:2px;}
  .lbl{font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--fg-muted);}
  .hex{font-family:var(--font-mono);font-size:10px;color:var(--fg);}
</style></head><body><div class="card">
<div class="row">
  <div class="sw"><div class="chip" style="background:#f02850"></div><div class="lbl">RED</div><div class="hex">#f02850</div></div>
  <div class="sw"><div class="chip" style="background:#f00078"></div><div class="lbl">MAGENTA</div><div class="hex">#f00078</div></div>
  <div class="sw"><div class="chip" style="background:#7828c8"></div><div class="lbl">PURPLE</div><div class="hex">#7828c8</div></div>
  <div class="sw"><div class="chip" style="background:#2828f0"></div><div class="lbl">INDIGO</div><div class="hex">#2828f0</div></div>
  <div class="sw"><div class="chip" style="background:#0050f0"></div><div class="lbl">BLUE</div><div class="hex">#0050f0</div></div>
  <div class="sw"><div class="chip" style="background:#0078f0"></div><div class="lbl">AZURE</div><div class="hex">#0078f0</div></div>
  <div class="sw"><div class="chip" style="background:#00a0c8"></div><div class="lbl">CYAN</div><div class="hex">#00a0c8</div></div>
  <div class="sw"><div class="chip" style="background:#00a050"></div><div class="lbl">TEAL</div><div class="hex">#00a050</div></div>
  <div class="sw"><div class="chip" style="background:#28c850"></div><div class="lbl">GREEN</div><div class="hex">#28c850</div></div>
  <div class="sw"><div class="chip" style="background:#78c828"></div><div class="lbl">LIME</div><div class="hex">#78c828</div></div>
  <div class="sw"><div class="chip" style="background:#f0c828"></div><div class="lbl">YELLOW</div><div class="hex">#f0c828</div></div>
  <div class="sw"><div class="chip" style="background:#f0a028"></div><div class="lbl">AMBER</div><div class="hex">#f0a028</div></div>
  <div class="sw"><div class="chip" style="background:#f07828"></div><div class="lbl">ORANGE</div><div class="hex">#f07828</div></div>
</div>
</div></body></html>
