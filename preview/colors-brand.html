<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);font-family:var(--font-sans);}
  .card{padding:24px 28px;min-height:150px;box-sizing:border-box;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
  .sw{display:flex;flex-direction:column;gap:6px;}
  .chip{width:72px;height:72px;border-radius:2px;border:1px solid var(--border);}
  .chip.lg{width:112px;height:96px;}
  .lbl{font-size:11px;letter-spacing:0.06em;color:var(--fg-muted);font-family:var(--font-sans);}
  .hex{font-family:var(--font-mono);font-size:11px;color:var(--fg);}
  .h{font-family:var(--font-serif);font-size:28px;font-weight:500;margin-bottom:18px;letter-spacing:-0.01em;border-top:3px double var(--rule);border-bottom:1px solid var(--rule);padding:6px 0;}
</style></head><body><div class="card">
<div class="row">
  <div class="sw"><div class="chip lg" style="background:#00173c"></div><div class="lbl">NAVY 900 · brand</div><div class="hex">#00173c</div></div>
  <div class="sw"><div class="chip lg" style="background:#00102a"></div><div class="lbl">NAVY 950</div><div class="hex">#00102a</div></div>
  <div class="sw"><div class="chip lg" style="background:#062454"></div><div class="lbl">NAVY 800</div><div class="hex">#062454</div></div>
  <div class="sw"><div class="chip lg" style="background:#0f356f"></div><div class="lbl">NAVY 700</div><div class="hex">#0f356f</div></div>
  <div class="sw"><div class="chip lg" style="background:#1c4a91"></div><div class="lbl">NAVY 600</div><div class="hex">#1c4a91</div></div>
  <div class="sw"><div class="chip lg" style="background:#0050f0"></div><div class="lbl">ACCENT</div><div class="hex">#0050f0</div></div>
</div>
</div></body></html>
