<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);}
  .card{padding:22px 28px;min-height:150px;box-sizing:border-box;}
  .stack{display:flex;flex-direction:column;gap:10px;}
  .specimen{font-family:var(--font-serif);color:var(--fg);}
  .d1{font-size:56px;font-weight:500;line-height:1.05;letter-spacing:-0.02em;}
  .d2{font-size:40px;font-weight:500;line-height:1.1;letter-spacing:-0.015em;}
  .d3{font-size:26px;font-weight:600;line-height:1.2;}
  .tag{font-family:var(--font-sans);font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--fg-muted);}
</style></head><body><div class="card">
<div class="stack">
  <div><div class="tag">Display · EB Garamond 56/1.05</div><div class="specimen d1">Ab initio</div></div>
  <div><div class="tag">H1 · EB Garamond 40/1.1</div><div class="specimen d2">Dinámica molecular de materiales amorfos</div></div>
  <div><div class="tag">H3 · EB Garamond 26/1.2 · 600</div><div class="specimen d3">Relación entre topología local y transporte electrónico</div></div>
</div>
</div></body></html>
